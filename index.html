<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Factory Overlord</title><meta name="theme-color" content="#0b0d10"><link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}body{margin:0;background:#090b0e;color:#eef1f4;font-family:Inter,system-ui,-apple-system,sans-serif}
button{font:inherit;border:0;color:inherit}.app{max-width:760px;margin:auto;min-height:100vh;background:#101318}
.top{position:sticky;top:0;z-index:10;background:#11151aee;backdrop-filter:blur(14px);padding:14px 16px;border-bottom:1px solid #272d35}
.brand{display:flex;justify-content:space-between;align-items:center}.title{font-weight:900;letter-spacing:.08em}.rank{font-size:11px;color:#aab3bd;text-transform:uppercase}
.money{font-size:28px;font-weight:900;margin-top:8px}.rate{color:#8ee0a8;font-size:13px}
.floor{margin:14px;background:#171c21;border:1px solid #303740;border-radius:20px;overflow:hidden;box-shadow:0 12px 40px #0008}
.floorhead{padding:14px 16px;display:flex;justify-content:space-between;background:#1d2329}.sector{font-size:11px;color:#9fa8b2;text-transform:uppercase;letter-spacing:.1em}.level{font-weight:800}
.scene{height:290px;position:relative;background:linear-gradient(#1a2025,#12161a);overflow:hidden}
.grid{position:absolute;inset:0;background:linear-gradient(#ffffff05 1px,transparent 1px),linear-gradient(90deg,#ffffff05 1px,transparent 1px);background-size:34px 34px;transform:perspective(400px) rotateX(55deg) scale(1.4);transform-origin:bottom}
.belt{position:absolute;height:34px;left:6%;right:6%;top:180px;background:#30373e;border:4px solid #454d55;border-radius:12px;overflow:hidden}.belt:after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 20px,#77808a 21px 24px);animation:move .65s linear infinite}.box{position:absolute;top:5px;width:22px;height:20px;background:#c8a45b;border-radius:4px;animation:box 3s linear infinite}.b2{animation-delay:1s}.b3{animation-delay:2s}@keyframes box{from{left:-30px}to{left:100%}}@keyframes move{to{transform:translateX(44px)}} 
.machine{position:absolute;width:110px;height:105px;border:3px solid #59636d;border-radius:12px;background:#242b31;top:45px;box-shadow:inset 0 -18px #1a1f24}.m1{left:8%}.m2{left:42%}.m3{right:8%}.machine b{display:block;text-align:center;margin-top:12px;font-size:10px;color:#d9e0e6}.gear{font-size:38px;text-align:center;animation:spin 2s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.worker{position:absolute;top:122px;font-size:25px;animation:walk 7s linear infinite}.w2{animation-delay:2.2s}.w3{animation-delay:4.4s}@keyframes walk{0%{left:-30px}50%{left:48%}100%{left:105%}}
.truck{position:absolute;right:-80px;bottom:18px;font-size:38px;animation:truck 9s linear infinite}@keyframes truck{to{right:110%}}
.controls{padding:12px 14px}.line{display:flex;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #2a3036}.line:last-child{border:0}.ico{font-size:26px}.ln{flex:1}.ln b{display:block}.ln small{color:#8f99a4}.upgrade{background:#e7c46a;color:#17130a;font-weight:900;padding:11px 13px;border-radius:11px}.upgrade:disabled{opacity:.35}.tabs{position:sticky;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(4,1fr);background:#11151a;border-top:1px solid #292f36}.tab{padding:13px 4px;text-align:center;background:none;color:#7f8993;font-size:11px}.tab.active{color:#fff}.panel{padding:0 14px 90px}.card{background:#181e23;border:1px solid #2c333b;border-radius:16px;padding:16px;margin:12px 0}.big{font-size:20px;font-weight:900}.bar{height:9px;background:#292f35;border-radius:9px;overflow:hidden;margin:10px 0}.bar i{display:block;height:100%;background:#d9b65d}.ownership{display:grid;grid-template-columns:1fr 1fr;gap:10px}.owned{padding:14px;border-radius:14px;background:#20262c;border:1px solid #303841}.owned small{color:#929ba5}.buy{width:100%;padding:13px;border-radius:12px;background:#d9b65d;color:#17130a;font-weight:900;margin-top:12px}.muted{color:#89939d;font-size:13px}
</style></head><body><div class="app">
<header class="top"><div class="brand"><div class="title">FACTORY OVERLORD</div><div class="rank" id="rank">INDUSTRIALIST</div></div><div class="money" id="money">$0</div><div class="rate" id="rate">$0/sec</div></header>
<section class="floor"><div class="floorhead"><div><div class="sector" id="sector">METAL DIVISION</div><div class="level" id="factory">Ironworks Factory</div></div><div class="level" id="owned">1 / 12 factories</div></div>
<div class="scene"><div class="grid"></div><div class="machine m1"><div class="gear">⚙️</div><b>SMELTER</b></div><div class="machine m2"><div class="gear">⚙️</div><b>PRESS</b></div><div class="machine m3"><div class="gear">⚙️</div><b>ASSEMBLER</b></div><div class="belt"><i class="box"></i><i class="box b2"></i><i class="box b3"></i></div><div class="worker">👷</div><div class="worker w2">👷</div><div class="worker w3">👷</div><div class="truck">🚚</div></div>
<div class="controls" id="lines"></div></section>
<div class="panel" id="panel"></div>
<nav class="tabs"><button class="tab active" onclick="show('factory',this)">🏭<br>Empire</button><button class="tab" onclick="show('assets',this)">🏢<br>Assets</button><button class="tab" onclick="show('contracts',this)">📜<br>Contracts</button><button class="tab" onclick="show('rank',this)">👑<br>Rank</button></nav>
</div>
<script>
const factories=[
["Ironworks Factory","Metal Division","🪨",100,4],["Lumber Mill","Timber Division","🪵",2500,55],["Gemworks","Diamond Division","💎",75000,800],["Steelworks","Steel Division","🏗️",500000,5000],["Oil Refinery","Energy Division","🛢️",4000000,28000],["Automotive Plant","Automotive Division","🚗",30000000,150000],["Electronics Works","Technology Division","💻",250000000,900000],["Aerospace Works","Aerospace Division","🚀",2000000000,5500000],["Pharmaceutical Labs","Pharma Division","🧪",18000000000,33000000],["Media Conglomerate","Media Division","📡",150000000000,200000000],["Global Logistics","Logistics Division","🚢",1500000000000,1300000000],["Industrial Empire","Global Holdings","👑",20000000000000,9000000000]];
const ranks=["Industrialist","Factory Owner","Industrial Magnate","Manufacturing Baron","Factory Tycoon","Industrial Tycoon","Corporate Industrialist","Conglomerate Owner","Global Industrialist","Industry Titan","Business Empire","Factory Overlord"];
let s=JSON.parse(localStorage.fo||"null")||{cash:250,lifetime:250,fi:0,level:1,last:Date.now(),prestige:0};
function fmt(n){if(n<1000)return "$"+Math.floor(n);let u=["K","M","B","T","Qa","Qi"];let i=-1;while(n>=1000&&i<u.length-1){n/=1000;i++}return "$"+n.toFixed(n<10?2:1)+u[i]}
function rate(){let f=factories[s.fi];return f[4]*Math.pow(1.17,s.level-1)*(1+s.prestige*.25)}
function save(){s.last=Date.now();localStorage.fo=JSON.stringify(s)}
function render(){let f=factories[s.fi];document.getElementById("money").textContent=fmt(s.cash);document.getElementById("rate").textContent=fmt(rate())+"/sec";document.getElementById("rank").textContent=ranks[s.fi];document.getElementById("sector").textContent=f[1].toUpperCase();document.getElementById("factory").textContent=f[0];document.getElementById("owned").textContent=(s.fi+1)+" / "+factories.length+" factories";
let up=f[3]*Math.pow(1.17,s.level-1);document.getElementById("lines").innerHTML=`<div class="line"><div class="ico">${f[2]}</div><div class="ln"><b>Production Line ${s.level}</b><small>Tier ${s.level} • ${fmt(rate())}/sec</small></div><button class="upgrade" ${s.cash<up?'disabled':''} onclick="upgrade()">UPGRADE<br>${fmt(up)}</button></div>`;
panelFactory()}
function upgrade(){let f=factories[s.fi],cost=f[3]*Math.pow(1.17,s.level-1);if(s.cash>=cost){s.cash-=cost;s.level++;save();render()}}
function panelFactory(){document.getElementById("panel").innerHTML=`<div class="card"><div class="big">Build your industrial empire</div><p class="muted">Upgrade the factory once per tier. No competing upgrade currencies or duplicate upgrade buttons.</p><div class="bar"><i style="width:${Math.min(100,s.level*10)}%"></i></div><b>${fmt(rate())} production / second</b></div><div class="card ownership"><div class="owned"><small>Factories owned</small><div class="big">${s.fi+1}</div></div><div class="owned"><small>Lifetime wealth</small><div class="big">${fmt(s.lifetime)}</div></div></div>`}
function show(x,el){document.querySelectorAll(".tab").forEach(t=>t.classList.remove("active"));el.classList.add("active");let p=document.getElementById("panel");if(x==="assets")p.innerHTML=`<div class="card"><div class="big">Property Portfolio</div><p class="muted">Every factory you unlock stays in your empire and contributes to your ownership rank.</p>${factories.map((f,i)=>`<div class="line"><div class="ico">${f[2]}</div><div class="ln"><b>${f[0]}</b><small>${i<=s.fi?"OWNED":"LOCKED"} • ${ranks[i]}</small></div></div>`).join("")}</div>`;else if(x==="contracts")p.innerHTML=`<div class="card"><div class="big">Major Contracts</div><p class="muted">Complete contracts to accelerate your rise from factory owner to global industrial empire.</p><button class="buy" onclick="s.cash+=rate()*60;s.lifetime+=rate()*60;save();render()">SHIP 60-SECOND ORDER</button></div>`;else if(x==="rank")p.innerHTML=`<div class="card"><div class="big">Ownership Ladder</div><p class="muted">Your title is determined by how much of the industrial world you control.</p>${ranks.map((r,i)=>`<div class="line"><div class="ln"><b>${r}</b><small>${i<=s.fi?"UNLOCKED":"LOCKED"} • ${factories[i][0]}</small></div></div>`).join("")}</div>`;else panelFactory()}
let elapsed=(Date.now()-s.last)/1000;if(elapsed>2){let earn=rate()*Math.min(elapsed,28800);s.cash+=earn;s.lifetime+=earn;save()}
setInterval(()=>{let e=.25;let x=rate()*e;s.cash+=x;s.lifetime+=x;render()},250);render();
</script></body></html>
